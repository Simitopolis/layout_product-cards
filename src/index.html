<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    />

    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>

  <body>
    <main class="page">
      <article
        class="card"
        data-qa="card"
      >
        <img
          class="card__image"
          src="./images/imac.jpeg"
          alt="APPLE A1419 iMac 27 inch Retina 5K Monoblock"
        />

        <h2 class="card__title">
          APPLE A1419 iMac 27&quot; Retina 5K Monoblock
          (MNED2UA/A)
        </h2>

        <p class="card__code">Product code: 195434</p>

        <div class="card__rating">
          <div class="stars stars--4">
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
          </div>

          <p class="card__reviews">Reviews: 5</p>
        </div>

        <div class="card__price-block">
          <p class="card__price-label">Price:</p>
          <p class="card__price-value">$2,199</p>
        </div>

        <a
          class="card__buy"
          href="#"
          data-qa="hover"
        >
          BUY
        </a>
      </article>
    </main>
  </body>
</html>
